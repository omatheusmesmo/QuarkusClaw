quarkus.http.auth.basic=true
# The Prometheus scrape carries token usage, provider and model names, and - once qlawkus.cost is on -
# what the owner is spending, so it must not be readable by anyone who can reach the port. /q/health/*
# stays open on purpose: the Compose healthcheck and the k8s probes read it without credentials.
# Prometheus supports basic_auth in its scrape config.
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=authenticated
# Admin auth: Argon2id (GPU-resistant), database-free, verified by qlawkus-client's
# Argon2AdminIdentityProvider. Gated on at build time here; the embedded properties realm stays off. This
# is the baseline - for stronger or federated auth add quarkus-oidc (endpoints are @Authenticated), which
# delegates password hashing (Argon2id) and RSA/ECC token signing to the IdP with no code change. See
# site/content/secrets.adoc.
qlawkus.admin.argon2.enabled=true
# Fail-closed: no prod default, so the app refuses to boot without a credential. Provide the PHC Argon2id
# hash via the keystore alias qlawkus.admin.password-hash (ordinal 350) or env QLAWKUS_ADMIN_PASSWORD_HASH;
# generate one as shown in the Secrets guide. %dev bakes a hash of 'dev' for frictionless local login.
%dev.qlawkus.admin.password-hash=$argon2id$v=19$m=19456,t=2,p=1$fukXIsitf4yIZrwHAFFP7A$lzdo9BmLtsfQN7xT7PdUe8auPVSlpQ3xx/wMesqUvFc

# Database-free secret store: the qlawkus-client extension auto-wires an encrypted PKCS12 keystore at
# qlawkus.secrets.keystore-path (default ~/.qlawkus/secrets.p12), inert until the file exists. Each
# alias is the config property name it overrides, consumed as ordinary config (no consumer change).
# Onboard a secret with: keytool -importpass -alias <config.property.name> -keystore <path> -storetype
# PKCS12. Provide the password via QLAWKUS_SECRETS_KEYSTORE_PASSWORD. quarkus-vault on the classpath is
# the managed alternative (a CredentialsProvider), no config needed here.
qlawkus.secrets.keystore-password=${QLAWKUS_SECRETS_KEYSTORE_PASSWORD:}

# Cognition backend (build-time): the deployable app uses hybrid - markdown files are the editable,
# git-versionable source of truth for facts, journals and skills, mirrored into pgvector for scale;
# working memory and the live persona/profile singletons stay in Postgres. Reconciliation runs once
# at boot (qlawkus.cognition.reconcile-at-start) so the file <-> pg mirror stays consistent.
qlawkus.cognition.backend=hybrid

# Unset leaves the Google tools dormant rather than blocking the boot: the OAuth client identifies the
# deployment, so it is supplied at deploy time (env, keystore, Vault), not before the app will start.
qlawkus.google.auth.client-id=${GOOGLE_CLIENT_ID:}
qlawkus.google.auth.client-secret=${GOOGLE_CLIENT_SECRET:}
qlawkus.google.auth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8742/api/google/oauth/callback}
qlawkus.google.vault.enabled=${QLAWKUS_VAULT_ENABLED:false}
qlawkus.google.vault.encryption-passphrase=${QLAWKUS_VAULT_PASSPHRASE:}
qlawkus.google.calendar.enabled=${QLAWKUS_CALENDAR_ENABLED:false}
qlawkus.brag.enabled=${QLAWKUS_BRAG_ENABLED:false}

# Skill Hub (remote skill registry): the agent searches, installs and publishes skills from skills.sh
