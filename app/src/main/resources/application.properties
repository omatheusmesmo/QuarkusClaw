# M6 LocalSecurityPolicy — activate to restrict shell to code-review build tools only.
# Enable via: quarkus.profile=code-review (or set these properties in your deployment env).
# %code-review.qlawkus.shell.allowlist-mode=true
# %code-review.qlawkus.shell.allowlist=mvn,mvn *,./mvnw,./mvnw *,gradle,gradle *,./gradlew,./gradlew *,npm,npm *,yarn,yarn *,pnpm,pnpm *,gh,gh *,git,git *

# Graceful shutdown. The budget is chosen against terminationGracePeriodSeconds in
# examples/redeploy/k8s/deployment.yaml (30s): 3s of delay lets the Service endpoint list catch up
# before the drain starts, 20s bounds the drain, and the remainder is margin before SIGKILL.
# The timeout also caps in-flight HTTP, and /api/chat is an SSE ReAct turn that can run for minutes,
# so this deliberately cuts a long turn rather than holding the rollout for it. Working memory is
# append-only, so a cut turn leaves the user message stored without a reply and nothing corrupted.
quarkus.shutdown.delay=3s
quarkus.shutdown.timeout=20s

# Model workloads. Background work gets its own circuit breaker and one call at a time, so a nightly
# job cannot open the breaker the owner's next message goes through. A synchronous bulkhead rejects
# rather than queues, so fallback-on-reject=false makes a throttled job skip its run instead of
# spending the fallback provider on work nobody is waiting for.
qlawkus.model.workload.interactive.max-concurrent=0
qlawkus.model.workload.interactive.fallback-on-reject=true
qlawkus.model.workload.batch.max-concurrent=1
qlawkus.model.workload.batch.fallback-on-reject=false
